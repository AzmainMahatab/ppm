name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

# Why the job-level `if`: GitHub cannot filter a push trigger by who pushed, so every branch
#      push starts the workflow and the jobs run only for the repository owner's pushes. Pull
#      requests into main always run, whoever opened them.
jobs:
  format:
    name: Formatting
    if: github.event_name == 'pull_request' || github.actor == github.repository_owner
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # rust-toolchain.toml pins the dated nightly `bindeps` needs, with clippy and rustfmt.
      - name: Install Pinned Rust Toolchain
        run: rustup toolchain install

      - name: Verify Formatting
        run: cargo fmt --all --check

  supply-chain:
    name: Advisories, Licences & Sources
    if: github.event_name == 'pull_request' || github.actor == github.repository_owner
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # cargo-deny reads the dependency graph through `cargo metadata`, which must run on the
      # pinned nightly: stable cargo rejects the `bindeps` artifact dependencies.
      - name: Install Pinned Rust Toolchain
        run: rustup toolchain install

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check Dependencies (deny.toml)
        run: cargo deny check

  build:
    name: Lint & Test Suite
    if: github.event_name == 'pull_request' || github.actor == github.repository_owner
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # No MSVC environment action: `cc` finds the compiler for each target (x64, x86) through
      # vswhere, and rustc finds the linker the same way.
      - name: Install Pinned Rust Toolchain
        run: rustup toolchain install

      - name: Restore Build Cache
        uses: Swatinem/rust-cache@v2

      - name: Build All Targets
        run: cargo build --workspace --all-targets

      - name: Static Analysis & Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace

  arm64:
    name: ARM64 Lint & Test Suite
    if: github.event_name == 'pull_request' || github.actor == github.repository_owner
    # Native ARM64: runs the engine's ARM64 build and the emulated-x64 e2e test, which an x64
    # runner cannot.
    runs-on: windows-11-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install rustup (if the image lacks it)
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -Uri 'https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe' -OutFile $installer
            & $installer -y --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { throw "rustup-init failed with exit code $LASTEXITCODE" }
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE '.cargo\bin')
          }

      # No MSVC environment action: the build compiles C++ for three targets (ARM64, x64, x86),
      # and `cc` locates the matching compiler for each through vswhere.
      - name: Install Pinned Rust Toolchain
        run: rustup toolchain install

      - name: Restore Build Cache
        uses: Swatinem/rust-cache@v2

      - name: Static Analysis & Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace
