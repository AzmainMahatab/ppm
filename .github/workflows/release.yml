name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version Bump Type (auto inspects conventional commits)"
        required: true
        default: "auto"
        type: choice
        options:
          - "auto"
          - "patch"
          - "minor"
          - "major"
      draft:
        description: "Create release as draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 1: Automated Semantic Version Resolution & Tagging
  # ─────────────────────────────────────────────────────────────────────────────
  version:
    name: Determine Version & Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version_output.outputs.tag }}
      changelog: ${{ steps.version_output.outputs.changelog }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `auto` lets the conventional commits decide, with `minor` for commits that select no
      # bump; an explicit choice is forced. A draft only calculates the tag (`dry_run`): the
      # release records the built commit, and the tag is created when the draft is published.
      - name: Resolve Dynamic Version & Changelog
        id: resolve_tag
        uses: mathieudutour/github-tag-action@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor
          force_bump: ${{ github.event.inputs.bump_type != 'auto' && github.event.inputs.bump_type || '' }}
          release_branches: main
          create_annotated_tag: true
          dry_run: ${{ github.event.inputs.draft }}

      # The changelog is built from commit messages, so it reaches the shell through the
      # environment, never by template substitution into the script.
      - name: Export Consolidated Version Output
        id: version_output
        env:
          PUSHED_TAG: ${{ github.ref_name }}
          NEW_TAG: ${{ steps.resolve_tag.outputs.new_tag }}
          CHANGELOG: ${{ steps.resolve_tag.outputs.changelog }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=$PUSHED_TAG" >> "$GITHUB_OUTPUT"
            echo "changelog=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$NEW_TAG" ]; then
            echo "::error::No releasable commits since the last tag; choose an explicit bump type to force one."
            exit 1
          fi
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          delimiter="CHANGELOG_$(openssl rand -hex 16)"
          {
            echo "changelog<<$delimiter"
            echo "$CHANGELOG"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 2: Multi-Architecture Build Matrix (x64 & ARM64)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.arch }})
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
            msvc_arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
            msvc_arch: amd64_arm64
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC Cross-Compilation Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # The target must be added to the toolchain rust-toolchain.toml pins, which is the one
      # cargo runs; adding it to a separately installed stable toolchain leaves the pinned
      # nightly without the cross-compilation standard library.
      - name: Install Pinned Rust Toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Compile Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Release Archive
        shell: pwsh
        run: |
          $tag = "${{ needs.version.outputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "The version job produced no tag"
          }
          $zipName = "ppm-$tag-windows-${{ matrix.arch }}.zip"
          $stagingDir = "staging_${{ matrix.arch }}"
          
          New-Item -ItemType Directory -Path $stagingDir -Force
          Copy-Item "target/${{ matrix.target }}/release/ppm.exe" "$stagingDir/ppm.exe"
          Copy-Item "README.md" "$stagingDir/README.md"
          Copy-Item "ARCHITECTURE.md" "$stagingDir/ARCHITECTURE.md"
          
          Compress-Archive -Path "$stagingDir/*" -DestinationPath $zipName -Force
          
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding ASCII

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ppm-artifact-${{ matrix.arch }}
          path: |
            ppm-*-windows-${{ matrix.arch }}.zip
            ppm-*-windows-${{ matrix.arch }}.zip.sha256

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 3: Smoke-test each archive on a runner of its own architecture
  # ─────────────────────────────────────────────────────────────────────────────
  smoke:
    name: Smoke Test (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - name: Checkout Smoke Script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ppm-artifact-${{ matrix.arch }}
          path: artifact

      - name: Run init and run from the archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifact -Filter "ppm-*-windows-${{ matrix.arch }}.zip" | Select-Object -First 1
          ./.github/scripts/smoke-release.ps1 -Archive $archive.FullName -Arch ${{ matrix.arch }}

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 4: Publish GitHub Release & Checksums
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [version, build, smoke]
    runs-on: windows-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_assets
          merge-multiple: true

      - name: Consolidate SHA256 Checksums
        shell: pwsh
        run: |
          Get-Content release_assets/*.sha256 | Out-File -FilePath release_assets/SHA256SUMS.txt -Encoding ASCII
          Remove-Item release_assets/*.sha256 -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "ppm ${{ needs.version.outputs.tag }}"
          body: ${{ needs.version.outputs.changelog }}
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            release_assets/ppm-*.zip
            release_assets/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}
