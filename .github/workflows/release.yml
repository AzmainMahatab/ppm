name: Release

on:
  # The version released is the one Cargo.toml declares: bump it in a commit first.
  workflow_dispatch:
    inputs:
      draft:
        description: "Create release as draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 1: Version From Cargo.toml, Tag & Changelog
  # ─────────────────────────────────────────────────────────────────────────────
  version:
    name: Determine Version & Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version_output.outputs.tag }}
      changelog: ${{ steps.version_output.outputs.changelog }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Why the manifest and not the commits: the binary reports the version Cargo.toml
      # declares, so a tag computed from commits drifted from it (v0.1.1 shipped reporting
      # 0.1.0). The tag is derived from the code; the code, the tag and the binary agree.
      - name: Read the Declared Version
        id: declared
        run: echo "version=$(python3 .github/scripts/cargo-version.py Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Refuse a Released or Mismatched Version
        env:
          TAG: v${{ steps.declared.outputs.version }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "$PUSHED_TAG" != "$TAG" ]; then
              echo "::error::Pushed tag $PUSHED_TAG does not match the version Cargo.toml declares ($TAG)."
              exit 1
            fi
          elif git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG is already released; bump the version in Cargo.toml first."
            exit 1
          fi

      # The exact version is passed in (`custom_tag`), so the action only tags and writes the
      # changelog from the conventional commits since the previous tag. A draft only calculates
      # it (`dry_run`): the tag is created when the draft is published.
      - name: Tag & Changelog
        id: resolve_tag
        uses: mathieudutour/github-tag-action@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.declared.outputs.version }}
          release_branches: main
          create_annotated_tag: true
          dry_run: ${{ github.event.inputs.draft }}

      # The changelog is built from commit messages, so it reaches the shell through the
      # environment, never by template substitution into the script.
      - name: Export Consolidated Version Output
        id: version_output
        env:
          TAG: v${{ steps.declared.outputs.version }}
          NEW_TAG: ${{ steps.resolve_tag.outputs.new_tag }}
          CHANGELOG: ${{ steps.resolve_tag.outputs.changelog }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "changelog=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$NEW_TAG" != "$TAG" ]; then
            echo "::error::The tag action produced '$NEW_TAG', not the declared $TAG."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          delimiter="CHANGELOG_$(openssl rand -hex 16)"
          {
            echo "changelog<<$delimiter"
            echo "$CHANGELOG"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 2: Multi-Architecture Build Matrix (x64 & ARM64)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.arch }})
    needs: version
    runs-on: windows-latest
    # The attestation is signed with this job's OIDC identity and stored with the repository.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # No MSVC environment action: `cc` and rustc locate the compiler and linker for the target,
      # including the x64-hosted ARM64 cross tools, through vswhere.

      # The target must be added to the toolchain rust-toolchain.toml pins, which is the one
      # cargo runs; adding it to a separately installed stable toolchain leaves the pinned
      # nightly without the cross-compilation standard library.
      - name: Install Pinned Rust Toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Compile Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Release Archive
        shell: pwsh
        run: |
          $tag = "${{ needs.version.outputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "The version job produced no tag"
          }
          $zipName = "ppm-$tag-windows-${{ matrix.arch }}.zip"
          $stagingDir = "staging_${{ matrix.arch }}"
          
          New-Item -ItemType Directory -Path $stagingDir -Force
          Copy-Item "target/${{ matrix.target }}/release/ppm.exe" "$stagingDir/ppm.exe"
          Copy-Item "README.md" "$stagingDir/README.md"
          Copy-Item "ARCHITECTURE.md" "$stagingDir/ARCHITECTURE.md"
          
          Compress-Archive -Path "$stagingDir/*" -DestinationPath $zipName -Force
          
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/$zipName.sha256", "$hash  $zipName`n")

      # Records, signed through Sigstore, that this exact archive was built by this workflow from
      # this commit; anyone can check a download with `gh attestation verify`.
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ppm-*-windows-${{ matrix.arch }}.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ppm-artifact-${{ matrix.arch }}
          path: |
            ppm-*-windows-${{ matrix.arch }}.zip
            ppm-*-windows-${{ matrix.arch }}.zip.sha256

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 3: Smoke-test each archive on a runner of its own architecture
  # ─────────────────────────────────────────────────────────────────────────────
  smoke:
    name: Smoke Test (${{ matrix.arch }})
    needs: [version, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - name: Checkout Smoke Script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ppm-artifact-${{ matrix.arch }}
          path: artifact

      - name: Run init and run from the archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifact -Filter "ppm-*-windows-${{ matrix.arch }}.zip" | Select-Object -First 1
          ./.github/scripts/smoke-release.ps1 -Archive $archive.FullName -Arch ${{ matrix.arch }} -Tag ${{ needs.version.outputs.tag }}

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 4: Publish GitHub Release & Checksums
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [version, build, smoke]
    runs-on: windows-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_assets
          merge-multiple: true

      # The last gate before anything is public: every archive must carry this repository's
      # build-provenance attestation, signed by this workflow.
      - name: Verify Build Provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          foreach ($archive in Get-ChildItem release_assets -Filter "ppm-*.zip") {
            gh attestation verify $archive.FullName --repo "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"
            if ($LASTEXITCODE -ne 0) { throw "No valid build provenance for $($archive.Name)" }
          }

      - name: Consolidate SHA256 Checksums
        shell: pwsh
        run: |
          # Why LF and not Out-File: `sha256sum -c` reads a CR as part of the file name, so a CRLF
          #      list fails on Linux, macOS and Git Bash (v0.1.0 shipped one).
          $lines = Get-ChildItem release_assets -Filter "*.sha256" | Sort-Object Name | Get-Content
          [IO.File]::WriteAllText("$PWD/release_assets/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          if ((Get-Content -Raw release_assets/SHA256SUMS.txt).Contains("`r")) {
            throw "SHA256SUMS.txt must use LF line endings"
          }
          Remove-Item release_assets/*.sha256 -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "ppm ${{ needs.version.outputs.tag }}"
          body: ${{ needs.version.outputs.changelog }}
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            release_assets/ppm-*.zip
            release_assets/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}
