[package]
name = "test-probe"
version = "0.1.0"
edition = "2021"
description = "Lightweight Win32 virtualization validation probe for ppm and redirector"
license = "MIT"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_Security_Credentials",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Environment",
    "Win32_System_Memory"
] }
