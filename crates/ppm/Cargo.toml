[package]
name = "ppm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Lightweight user-mode Windows virtualization engine and multi-architecture portable package manager"
readme = "../../README.md"
keywords = [
    "portable",
    "virtualization",
    "windows",
    "detours",
    "package-manager"
]
categories = [
    "command-line-utilities",
    "os::windows-apis",
    "development-tools"
]

[build-dependencies]
cc = "1.2"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
indicatif = "0.18"
comfy-table = "8.0"
sevenz-rust = "0.6"
zip = "8.6"
cab = "0.6"
msi = "0.10"
serde.workspace = true
serde_json.workspace = true
serde_yml = "0.0.13"
schemars = "1.0"
sha2 = "0.11"
hex.workspace = true
regex = "1.11"
tempfile = "3.18"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Environment",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader"
] }
anyhow = "1"
# Intention: Build-ordering edge only; the rlib is never linked into the binary.
# Why: Guarantees redirector.dll is fully compiled before ppm's build script embeds it.
redirector = { path = "../redirector" }

[lints]
workspace = true
