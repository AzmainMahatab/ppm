[package]
name = "ppm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Lightweight user-mode Windows virtualization engine and multi-architecture portable package manager"
readme = "../../README.md"
keywords = [
    "portable",
    "virtualization",
    "windows",
    "detours",
    "package-manager"
]
categories = [
    "command-line-utilities",
    "os::windows-apis",
    "development-tools"
]

[dependencies]
anyhow.workspace = true
cab.workspace = true
clap = { workspace = true, features = ["derive"] }
comfy-table.workspace = true
flate2.workspace = true
indicatif.workspace = true
injection = { path = "../injection" }
msi.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sevenz-rust2 = { workspace = true, features = ["util", "bzip2", "ppmd"] }
tar.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Environment",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader"
] }
zip.workspace = true
# Intention: Build redirector.dll as a cdylib artifact of ppm's own build graph.
# Why: Cargo compiles the cdylib before ppm compiles and exports its exact staging path
#      (CARGO_CDYLIB_FILE_REDIRECTOR_redirector), which core/assets.rs embeds via include_bytes!.
#      This replaces the former plain path dependency + build-script layout-guessing with a
#      first-class artifact edge - no candidate fallbacks, no reverse-engineered promotion rules.
redirector = { path = "../redirector", artifact = "cdylib" }
engine-x86 = { path = "../engine-x86" }

# Why only on ARM64: an ARM64 host runs x64 applications under emulation, and those need the x64
#      engine; an x64 build has no foreign 64-bit machine to serve.
[target.'cfg(target_arch = "aarch64")'.dependencies]
engine-x64 = { path = "../engine-x64" }

[dev-dependencies]
jsonschema = "0.52.1"
# Intention: Provide the virtualization probe executable through Cargo's own build graph.
# Why: A bin-artifact dependency makes Cargo compile the probe whenever test targets are built and
#      export its absolute path (CARGO_BIN_FILE_TEST_PROBE_test-probe); dev-dependencies never enter
#      release graphs, so shipping purity is structural - no feature flags, no runtime bootstrapping.
#      Enabled by the `[unstable] bindeps` opt-in on the toolchain pinned in rust-toolchain.toml.
test-probe = { path = "../test-probe", artifact = "bin" }
# The same probe built for x86, so the suite can verify injection across bitness.
probe-x86 = { path = "../probe-x86" }

[lints]
workspace = true
