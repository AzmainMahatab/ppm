[package]
name = "redirector"
version = "0.1.0"
edition = "2021"
description = "Lowest-boundary Win32/NT native system call detours and Copy-on-Write virtualization library"
license = "MIT"
keywords = [
    "virtualization",
    "detours",
    "ntdll",
    "copy-on-write",
    "windows"
]
categories = [
    "os::windows-apis",
    "development-tools"
]

[lib]
crate-type = ["cdylib"]

[build-dependencies]
cc = "1.2"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemServices",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_Registry"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
