[package]
name = "redirector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Lowest-boundary Win32/NT native system call detours and Copy-on-Write virtualization library"
keywords = [
    "virtualization",
    "detours",
    "ntdll",
    "copy-on-write",
    "windows"
]
categories = [
    "os::windows-apis",
    "development-tools"
]

# Why: Only the cdylib ships. `ppm` consumes it through an `artifact = "cdylib"` edge, which
#      orders the build without linking anything from this crate.
[lib]
crate-type = ["cdylib"]

[dependencies]
injection = { path = "../injection" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_SystemServices",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_Registry"
] }
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
hex.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
tracing-appender.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
