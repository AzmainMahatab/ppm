[workspace]
members = [
    "crates/ppm",
    "crates/probe-x64",
    "crates/probe-x86",
    "crates/engine-x64",
    "crates/engine-x86",
    "crates/injection",
    "crates/redirector",
    "crates/test-probe"
]
# Intention: Mark ppm as the sole release candidate for bare root-level commands.
# Why: A virtual workspace makes every member a default build target, which would emit the
#      test-probe tooling binary into `cargo build --release` output. The dependency tree still
#      decides everything ppm needs: redirector.dll arrives through its cdylib artifact edge and
#      test-probe through the bin-artifact dev-dependency exercised by the e2e suite.
default-members = ["crates/ppm"]

# Intention: Pin resolver v3 explicitly instead of relying on edition implications.
# Why: This is a virtual workspace (no root package), so `edition = "2024"` does NOT imply the
#      resolver here - member editions are invisible to resolution. Resolver v3 activates
#      MSRV-aware dependency selection (`incompatible-rust-versions = "fallback"`) so the
#      workspace `rust-version` governs which dependency versions may enter Cargo.lock.
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.98"
repository = "https://github.com/AzmainMahatab/ppm"
# Why: ppm ships as a GitHub release binary, never through crates.io, and its crates depend on
#      each other by path, which a published crate cannot.
publish = false

# Intention: Single-source every third-party dependency version so the three crates can never drift.
# Why: Only versions centralize; feature sets stay per-crate and additive (see windows-sys).
[workspace.dependencies]
anyhow = "1"
cab = "0.6"
cc = "1.2"
clap = "4.5"
comfy-table = "8.0"
flate2 = "1.1"
hex = "0.4"
indicatif = "0.18"
msi = "0.10"
# Why defaults off: ppm only reads PE headers; the writers and other formats are dead weight.
object = { version = "0.40", default-features = false }
parking_lot = "0.13"
regex = "1.11"
reqwest = "0.13"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "2.0"
# Why: ppm only decodes; the default encoder and AES features add build time and code for
#      nothing. Edition 2024 needs the defaults opt-out on the workspace entry itself.
sevenz-rust2 = { version = "0.24", default-features = false }
tar = "0.4"
tempfile = "3.18"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
# Intention: Authoritative default-features opt-out lives at the root.
# Why: Edition 2024 rejects `default-features = false` on an inherited dependency unless the
#      workspace entry itself disables defaults; redirector adds "fmt"/"env-filter" additively.
tracing-subscriber = { version = "0.3", default-features = false }
windows-sys = { version = "0.61" }
zip = "9.0"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = "warn"
perf = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
